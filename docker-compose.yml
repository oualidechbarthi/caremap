# Lancement local de CareMap avec Docker : docker compose up -d --build
# Deux conteneurs : le backend (FastAPI, port 8000 interne) et le frontend (nginx).
# Ouvrir ensuite http://localhost:8080
services:
  # Le backend n'est pas publié sur votre PC : seul nginx (frontend) lui parle
  backend:
    build: ./backend
    container_name: caremap-backend
    restart: unless-stopped
    volumes:
      # Keeps the SQLite cache on your machine, so downloaded OSM data survives rebuilds
      - ./backend/data:/app/data

  # Le frontend est accessible sur http://localhost:8080 (port 80 du conteneur)
  frontend:
    build: ./frontend
    container_name: caremap-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    # Démarre seulement quand le backend répond à /api/health (HEALTHCHECK du Dockerfile)
    depends_on:
      backend:
        condition: service_healthy
