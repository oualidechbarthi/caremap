# Configuration de nginx dans le conteneur frontend :
# il sert l'application React et transmet les appels /api/ au backend.
server {
    # Écoute sur le port 80 du conteneur (publié en 8080 sur votre PC par docker-compose.yml)
    listen 80;
    server_name _;

    # Dossier des fichiers compilés par Vite
    root /usr/share/nginx/html;
    index index.html;

    # Compression des fichiers envoyés au navigateur (chargement plus rapide)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API calls go to the FastAPI container (same as the Vite dev proxy)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Transmet la vraie adresse IP du visiteur (utilisée par /api/locate)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Long cache for hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
